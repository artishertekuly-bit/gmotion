<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: transparent !important;
    font-family: Consolas, 'DejaVu Sans Mono', monospace;
  }
  canvas#crt {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
  }
  .term {
    position: absolute;
    left: 72px;
    right: 72px;
    top: 148px;
    padding: 26px 32px;
    border-radius: 22px;
    background: rgba(11, 11, 11, 0.92);
    border: 2px solid rgba(0, 230, 118, 0.55);
    color: #EDE6DE;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
  }
  .hdr {
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    color: #00E676;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  .line {
    font-size: 36px;
    line-height: 1.38;
    font-weight: 700;
  }
  .accent { color: #FFD600; }
</style>
</head>
<body>
<canvas id="crt" width="1080" height="1920"></canvas>
<div class="term" id="term">
  <div class="hdr">
    <span>SYS // KZT_EXCHANGE_CHECK</span>
    <span id="clock">00:33:52</span>
  </div>
  <div class="line" id="l1"></div>
  <div class="line accent" id="l2"></div>
</div>

<script>
(() => {
  const cv = document.getElementById('crt');
  const ctx = cv.getContext('2d');
  const term = document.getElementById('term');
  const l1 = document.getElementById('l1');
  const l2 = document.getElementById('l2');
  const DUR = 6.1;
  const TXT1 = '> БАҒАМ: $ / € -> ТЕҢГЕ?';
  const TXT2 = '> 160,000,000 ₸ / ТӘУЛІК';

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function smoothstep(a, b, x) {
    const u = clamp((x - a) / Math.max(1e-6, b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }

  window.seek = function (t) {
    const inU = smoothstep(0.0, 0.4, t);
    const outU = 1.0 - smoothstep(DUR - 0.4, DUR, t);
    const vis = clamp(inU * outU, 0, 1);

    term.style.opacity = vis.toFixed(4);
    term.style.transform = `translate3d(0, ${((1 - inU) * -28).toFixed(2)}px, 0) scale(${(0.93 + 0.07 * inU).toFixed(4)})`;

    const c1 = Math.floor(smoothstep(0.15, 2.2, t) * TXT1.length);
    const c2 = Math.floor(smoothstep(2.4, 4.4, t) * TXT2.length);
    const cursor = (Math.floor(t * 3) % 2 === 0) ? '_' : ' ';
    l1.textContent = TXT1.slice(0, c1) + (c2 === 0 ? cursor : '');
    l2.textContent = c2 > 0 ? TXT2.slice(0, c2) + cursor : '';

    ctx.clearRect(0, 0, 1080, 1920);
    if (vis <= 0.01) return;

    // Subtle CRT scanlines + scanning laser beam (lemo-opuscar core/post/crt.js pattern)
    ctx.save();
    ctx.globalAlpha = vis * 0.20;
    ctx.fillStyle = '#00E676';
    for (let y = 148; y < 400; y += 6) {
      ctx.fillRect(74, y, 932, 1);
    }
    const scanY = 148 + ((t * 95) % 240);
    ctx.globalAlpha = vis * 0.35;
    ctx.fillStyle = '#FFD600';
    ctx.fillRect(74, scanY, 932, 3);
    ctx.restore();
  };
  window.seek(0);
})();
</script>
</body>
</html>
