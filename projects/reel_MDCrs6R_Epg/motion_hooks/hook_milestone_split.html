<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: transparent !important;
    font-family: 'Segoe UI Black', 'DejaVu Sans', Arial, sans-serif;
  }
  canvas#chart {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
  }
  .panel {
    position: absolute;
    left: 72px;
    right: 72px;
    top: 135px;
    padding: 28px 34px 190px 34px;
    border-radius: 28px;
    background: rgba(12, 16, 15, 0.90);
    border: 2px solid rgba(255, 214, 0, 0.65);
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6);
  }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .tag {
    padding: 8px 18px;
    border-radius: 999px;
    background: #FFD600;
    color: #0B0B0B;
    font-size: 22px;
    letter-spacing: 1.5px;
  }
  .stat {
    font-size: 38px;
    color: #00E676;
    font-variant-numeric: tabular-nums;
  }
  .title {
    font-size: 40px;
    line-height: 1.15;
    color: #FFFFFF;
  }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="row-top">
    <div class="tag">ФЕНОМЕНАЛДЫ НӘТИЖЕ</div>
    <div class="stat" id="rate">+160 МЛН / КҮН</div>
  </div>
  <div class="title">ҚАЗАҚ КИНОСЫНДА БІРІНШІ РЕТ</div>
</div>
<canvas id="chart" width="1080" height="1920"></canvas>

<script>
(() => {
  const cv = document.getElementById('chart');
  const ctx = cv.getContext('2d');
  const panel = document.getElementById('panel');
  const rate = document.getElementById('rate');
  const DUR = 5.1;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function smoothstep(a, b, x) {
    const u = clamp((x - a) / Math.max(1e-6, b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }

  window.seek = function (t) {
    const inU = smoothstep(0.0, 0.45, t);
    const outU = 1.0 - smoothstep(DUR - 0.35, DUR, t);
    const vis = clamp(inU * outU, 0, 1);

    const sc = 0.92 + 0.08 * (1 - Math.pow(1 - inU, 3));
    panel.style.opacity = vis.toFixed(4);
    panel.style.transform = `translate3d(0, ${((1 - inU) * -32).toFixed(2)}px, 0) scale(${sc.toFixed(4)})`;

    const cProg = smoothstep(0.35, 2.2, t);
    const shownVal = Math.round(cProg * 160);
    rate.textContent = `+${shownVal} МЛН / КҮН`;

    ctx.clearRect(0, 0, 1080, 1920);
    if (vis <= 0.01) return;

    // Draw trajectory curve inside the upper panel chart slot (y: 310..445)
    const x0 = 116, x1 = 964, yBase = 440, hMax = 125;
    ctx.save();
    ctx.globalAlpha = vis;

    // Subtle baseline ticks
    ctx.strokeStyle = 'rgba(237, 230, 222, 0.16)';
    ctx.lineWidth = 1;
    for (let k = 0; k < 4; k++) {
      const yy = yBase - (hMax / 3) * k;
      ctx.beginPath();
      ctx.moveTo(x0, yy);
      ctx.lineTo(x1, yy);
      ctx.stroke();
    }

    // Monotone rising curve revealed over [0.25 .. 2.4s]
    const drawU = smoothstep(0.25, 2.4, t);
    const steps = 64;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const frac = (i / steps) * drawU;
      const px = x0 + (x1 - x0) * frac;
      const curve = Math.pow(frac, 1.85) * 0.85 + Math.sin(frac * 9) * 0.03 * frac;
      const py = yBase - clamp(curve, 0, 1) * hMax;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = '#00E676';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Glowing head marker
    if (drawU > 0.02) {
      const hx = x0 + (x1 - x0) * drawU;
      const hCurve = Math.pow(drawU, 1.85) * 0.85 + Math.sin(drawU * 9) * 0.03 * drawU;
      const hy = yBase - clamp(hCurve, 0, 1) * hMax;
      ctx.fillStyle = '#FFD600';
      ctx.beginPath();
      ctx.arc(hx, hy, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    // Subtle vertical behind-speaker light beams at left/right edges
    const grad = ctx.createLinearGradient(0, 500, 0, 1500);
    grad.addColorStop(0, 'rgba(0, 230, 118, 0.08)');
    grad.addColorStop(1, 'rgba(0, 230, 118, 0.0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 500, 48, 1000);
    ctx.fillRect(1032, 500, 48, 1000);

    ctx.restore();
  };
  window.seek(0);
})();
</script>
</body>
</html>
