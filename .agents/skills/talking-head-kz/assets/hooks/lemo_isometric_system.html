<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>5. lemo_isometric_system</title>
<style>html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
// lemo-opuscar + opus-video-prompts isometric pipeline cubes + flowing nodes
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { W, clamp, seg, springPhys, envelope, drawAsset } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  drawAsset(ctx, imgs.dotgrid, W / 2, 380, 960, 0, 0.28 * alpha);

  function isoCube(cx, cy, s, h, colTop, colL, colR, lift) {
    const dx = s * 0.866, dy = s * 0.5;
    const y = cy - lift;
    ctx.save();
    // Left
    ctx.beginPath();
    ctx.moveTo(cx, y); ctx.lineTo(cx - dx, y - dy); ctx.lineTo(cx - dx, y - dy + h); ctx.lineTo(cx, y + h);
    ctx.closePath(); ctx.fillStyle = colL; ctx.fill();
    // Right
    ctx.beginPath();
    ctx.moveTo(cx, y); ctx.lineTo(cx + dx, y - dy); ctx.lineTo(cx + dx, y - dy + h); ctx.lineTo(cx, y + h);
    ctx.closePath(); ctx.fillStyle = colR; ctx.fill();
    // Top
    ctx.beginPath();
    ctx.moveTo(cx, y); ctx.lineTo(cx + dx, y - dy); ctx.lineTo(cx, y - dy * 2); ctx.lineTo(cx - dx, y - dy);
    ctx.closePath(); ctx.fillStyle = colTop; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  const nodes = [
    { x: 250, y: 420, label: 'ДЕРЕК' },
    { x: 540, y: 340, label: 'ЖҮЙЕ' },
    { x: 830, y: 420, label: 'НӘТИЖЕ' },
  ];

  // Connecting isometric flow beams
  const beamP = clamp(seg(t, 0.15, 0.85));
  ctx.strokeStyle = cfg.accent2;
  ctx.lineWidth = 5;
  ctx.setLineDash([16, 12]);
  ctx.lineDashOffset = -t * 140;
  ctx.beginPath();
  ctx.moveTo(nodes[0].x, nodes[0].y - 30);
  ctx.lineTo(nodes[0].x + (nodes[1].x - nodes[0].x) * beamP, nodes[0].y - 30 + (nodes[1].y - nodes[0].y) * beamP);
  ctx.moveTo(nodes[1].x, nodes[1].y - 30);
  ctx.lineTo(nodes[1].x + (nodes[2].x - nodes[1].x) * beamP, nodes[1].y - 30 + (nodes[2].y - nodes[1].y) * beamP);
  ctx.stroke();
  ctx.setLineDash([]);

  nodes.forEach((n, idx) => {
    const sp = springPhys(Math.max(0, t - idx * 0.14), 220, 18);
    const bob = Math.sin(t * 2.4 + idx * 1.1) * 8;
    const active = idx === 1;
    isoCube(
      n.x, n.y + 40, 74 * (0.88 + 0.12 * sp), 58 * sp,
      active ? cfg.accent : '#263238',
      active ? '#C69D00' : '#182026',
      active ? '#9E7B00' : '#10151A',
      bob
    );
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.font = '800 26px "JetBrains Mono", monospace';
    ctx.fillText(n.label, n.x, n.y + 115);
  });

  ctx.fillStyle = '#FFFFFF';
  ctx.font = '900 40px "Unbounded", "Montserrat", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText((cfg.title || 'АЛГОРИТМ ЖӘНЕ ПРОЦЕСС').toUpperCase().slice(0, 26), W / 2, 195);
  ctx.restore();
}, {
  dotgrid: '../frazix/frazix_dotgrid.png',
});
</script>
</body>
</html>
