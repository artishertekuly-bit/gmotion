<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>11. split_60_40_simulation</title>
<style>html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
// Top 40% live exponential curve & 3D orbit simulation; Bottom 60% transparent for speaker framing
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { W, clamp, seg, springPhys, envelope, roundRectPath } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  const sp = springPhys(t, 220, 18);
  const splitH = 740;
  const title = (cfg.title || 'ӨСІМ ДИНАМИКАСЫ').toUpperCase();
  const label = (cfg.label || 'LIVE SIMULATION · 40% TOP').toUpperCase();

  ctx.save();
  ctx.globalAlpha = alpha;

  // Dark upper 40% panel with slide-down spring
  const yOff = -(1 - clamp(sp, 0, 1.04)) * 90;
  ctx.fillStyle = 'rgba(11, 12, 14, 0.94)';
  ctx.fillRect(0, yOff, W, splitH);

  // Accent divider rail separating top 40% simulation from bottom 60% speaker
  ctx.fillStyle = cfg.accent;
  ctx.fillRect(0, splitH + yOff - 5, W, 6);

  // Subtle chart grid
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  for (let gx = 120; gx <= 960; gx += 140) {
    ctx.beginPath(); ctx.moveTo(gx, 190 + yOff); ctx.lineTo(gx, 660 + yOff); ctx.stroke();
  }
  for (let gy = 220; gy <= 640; gy += 105) {
    ctx.beginPath(); ctx.moveTo(90, gy + yOff); ctx.lineTo(990, gy + yOff); ctx.stroke();
  }

  // Animated growth curve with glowing fill under curve
  const drawU = clamp(seg(t, 0.12, Math.min(cfg.dur - 0.5, 1.8)));
  const pts = 40;
  ctx.beginPath();
  for (let i = 0; i <= Math.floor(pts * drawU); i++) {
    const u = i / pts;
    const x = 110 + u * 860;
    const y = 630 - Math.pow(u, 1.75) * 365 - Math.sin(u * 12 + t * 2) * 14 + yOff;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = cfg.accent2;
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Leading dot + live pill
  const lu = drawU;
  const lx = 110 + lu * 860;
  const ly = 630 - Math.pow(lu, 1.75) * 365 - Math.sin(lu * 12 + t * 2) * 14 + yOff;
  ctx.fillStyle = cfg.accent;
  ctx.beginPath(); ctx.arc(lx, ly, 12, 0, Math.PI * 2); ctx.fill();

  roundRectPath(ctx, 90, 95 + yOff, 390, 44, 22);
  ctx.fillStyle = 'rgba(0,230,118,0.16)';
  ctx.fill();
  ctx.fillStyle = cfg.accent2;
  ctx.font = '800 20px "JetBrains Mono", monospace';
  ctx.fillText(label.slice(0, 28), 114, 124 + yOff);

  ctx.fillStyle = '#FFFFFF';
  ctx.font = '900 44px "Unbounded", "Montserrat", sans-serif';
  ctx.fillText(title.slice(0, 22), 90, 185 + yOff);
  ctx.restore();
}, {});
</script>
</body>
</html>
