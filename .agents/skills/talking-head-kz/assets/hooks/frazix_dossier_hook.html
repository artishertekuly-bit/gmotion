<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>1. frazix_dossier_hook</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// Parametrized Detective Dossier Card driven by window.EDL_PAYLOAD
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { springPhys, envelope, drawAsset, roundRectPath, drawStageBackdrop, deriveText } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  drawStageBackdrop(ctx, cfg.W, cfg.H, cfg, t);
  const { title, subtitle, label } = deriveText(cfg);
  const sp = springPhys(t, 220, 18);
  const stampText = String(cfg.stamp || cfg.label || '').toUpperCase().slice(0, 14);

  ctx.save();
  ctx.globalAlpha = alpha;
  drawAsset(ctx, imgs.dotgrid, cfg.W / 2, cfg.cy + (1 - sp) * 28, 920, 0, 0.34 * alpha);

  const cardScale = (cfg.isFull ? 1.08 : 0.96) * (0.90 + 0.10 * sp);
  const cardRot = (-3.2 + Math.sin(t * 1.4) * 0.6) * Math.PI / 180;
  ctx.save();
  ctx.translate(cfg.W / 2, cfg.cy);
  ctx.rotate(cardRot);
  ctx.scale(cardScale, cardScale);
  drawAsset(ctx, imgs.dossier, 0, 0, 820, 0, 0.96);

  if (label) {
    ctx.fillStyle = '#0B0B0B';
    ctx.font = '800 22px "JetBrains Mono", Consolas, monospace';
    ctx.fillText(label.toUpperCase().slice(0, 28), -320, -108);
  }
  ctx.fillStyle = '#161216';
  ctx.font = '900 42px "Unbounded", "Montserrat", sans-serif';
  const upTitle = title.toUpperCase();
  ctx.fillText(upTitle.slice(0, 22), -320, -34);
  if (upTitle.length > 22) ctx.fillText(upTitle.slice(22, 44), -320, 20);
  if (subtitle) {
    ctx.fillStyle = '#332C28';
    ctx.font = 'italic 700 28px "Playfair Display", serif';
    ctx.fillText(subtitle.slice(0, 34), -320, 74);
  }

  const stampSp = springPhys(Math.max(0, t - 0.38), 260, 16);
  if (stampSp > 0.01 && stampText) {
    ctx.save();
    ctx.translate(215, 76);
    ctx.rotate(-0.18);
    ctx.scale(1.16 - 0.16 * stampSp, 1.16 - 0.16 * stampSp);
    roundRectPath(ctx, -112, -28, 224, 56, 8);
    ctx.strokeStyle = cfg.danger;
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.fillStyle = cfg.danger;
    ctx.textAlign = 'center';
    ctx.font = '900 24px "JetBrains Mono", monospace';
    ctx.fillText(stampText, 0, 9);
    ctx.restore();
  }

  drawAsset(ctx, imgs.barcode, -210, 108, 185, 0, 0.85);
  ctx.restore();

  const scanY = cfg.cy - 185 + ((t * 190) % 370);
  ctx.fillStyle = cfg.accent;
  ctx.globalAlpha = 0.25 * alpha;
  ctx.fillRect(140, scanY, 800, 3);
  ctx.restore();
}, {
  dossier: '../frazix/frazix_dossier_card.png',
  barcode: '../frazix/frazix_barcode.png',
  dotgrid: '../frazix/frazix_dotgrid.png',
});
</script>
</body>
</html>
