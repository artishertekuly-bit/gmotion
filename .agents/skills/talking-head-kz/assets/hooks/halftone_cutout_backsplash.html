<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>9. halftone_cutout_backsplash</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// Giant 1-2 word headline emerging above/behind speaker head (y=120..320 for behind_speaker compliance)
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { springPhys, envelope, drawAsset, drawStageBackdrop, deriveText } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  drawStageBackdrop(ctx, cfg.W, cfg.H, cfg, t);
  const { title, label } = deriveText(cfg);
  const sp = springPhys(t, 220, 18);
  const textY = cfg.isFull || cfg.isSplit ? cfg.cy : 250;

  ctx.save();
  ctx.globalAlpha = alpha;
  const pulse = 1 + Math.sin(t * 2.5) * 0.04;
  const g = ctx.createRadialGradient(cfg.W / 2, textY, 30, cfg.W / 2, textY, 520 * pulse);
  g.addColorStop(0, 'rgba(255,214,0,0.36)');
  g.addColorStop(0.55, 'rgba(237,59,34,0.16)');
  g.addColorStop(1, 'rgba(14,12,14,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cfg.W, cfg.H);

  drawAsset(ctx, imgs.halftone, cfg.W / 2, cfg.H / 2 + Math.sin(t * 0.9) * 14, cfg.W, cfg.H, 0.42 * alpha);

  const sc = 0.92 + 0.08 * sp;
  ctx.save();
  ctx.translate(cfg.W / 2, textY);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  const mainWord = title.toUpperCase().split(/\s+/).slice(0, 2).join(' ').slice(0, 12);
  ctx.font = '900 168px "Unbounded", "Montserrat", sans-serif';
  for (let d = 10; d >= 1; d--) {
    ctx.fillStyle = d % 2 === 0 ? '#161216' : '#0B0B0B';
    ctx.fillText(mainWord, d * 1.4, d * 1.6);
  }
  ctx.fillStyle = cfg.accent;
  ctx.fillText(mainWord, 0, 0);

  if (label && (cfg.isFull || cfg.isSplit)) {
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '800 34px "Montserrat", sans-serif';
    ctx.fillText(label.toUpperCase().slice(0, 26), 0, -145);
  }
  ctx.restore();
  ctx.restore();
}, {
  halftone: '../../engine/assets/textures/halftone_1080x1920.png',
});
</script>
</body>
</html>
