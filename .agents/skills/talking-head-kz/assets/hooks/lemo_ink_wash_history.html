<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>4. lemo_ink_wash_history</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// Ink-wash parallax background + timeline ticks + serif insight driven by EDL_PAYLOAD
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { clamp, vnoise2d, springPhys, envelope, drawAsset, drawStageBackdrop, deriveText } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  drawStageBackdrop(ctx, cfg.W, cfg.H, cfg, t);
  const { title, subtitle, label } = deriveText(cfg);
  const sp = springPhys(t, 190, 18);

  ctx.save();
  ctx.globalAlpha = alpha;
  for (let i = 0; i < 6; i++) {
    const bx = 220 + vnoise2d(i * 1.7 + t * 0.18, 0.5) * 440;
    const by = cfg.cy - 90 + vnoise2d(0.3, i * 2.1 + t * 0.14) * 240;
    const r = (240 + i * 45) * sp;
    const grad = ctx.createRadialGradient(bx, by, 10, bx, by, r);
    grad.addColorStop(0, i % 2 === 0 ? 'rgba(237,230,222,0.18)' : 'rgba(255,214,0,0.13)');
    grad.addColorStop(1, 'rgba(14,12,14,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
  }

  ctx.strokeStyle = 'rgba(237,230,222,0.45)';
  ctx.lineWidth = 2;
  const lineW = 780 * clamp(sp);
  ctx.beginPath();
  ctx.moveTo(cfg.W / 2 - lineW / 2, cfg.cy + 35);
  ctx.lineTo(cfg.W / 2 + lineW / 2, cfg.cy + 35);
  ctx.stroke();

  const shift = (t * 28) % 80;
  for (let x = 180; x <= 900; x += 80) {
    const px = x - shift;
    if (px < 160 || px > 920) continue;
    ctx.beginPath(); ctx.moveTo(px, cfg.cy + 25); ctx.lineTo(px, cfg.cy + 45); ctx.stroke();
  }

  drawAsset(ctx, imgs.halftone, cfg.W / 2, cfg.H / 2, cfg.W, cfg.H, 0.18 * alpha);

  ctx.textAlign = 'center';
  if (label) {
    ctx.fillStyle = cfg.accent;
    ctx.font = '800 24px "Montserrat", sans-serif';
    ctx.fillText(label.toUpperCase().slice(0, 30), cfg.W / 2, cfg.cy - 45);
  }
  if (title) {
    ctx.fillStyle = '#EDE6DE';
    ctx.font = 'italic 900 58px "Playfair Display", Georgia, serif';
    ctx.fillText(title.slice(0, 28), cfg.W / 2, cfg.cy + 12);
  }
  if (subtitle) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '700 28px "Montserrat", sans-serif';
    ctx.fillText(subtitle.slice(0, 36), cfg.W / 2, cfg.cy + 95);
  }
  ctx.restore();
}, {
  halftone: '../../engine/assets/textures/halftone_1080x1920.png',
});
</script>
</body>
</html>
