<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>3. threejs_3d_floating_totem</title>
<style>html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
// Perspective 3D Floating Totem + Rotating Gold Compass + Orbital Sparkle Field (fov=40 vertical camera math)
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { W, clamp, springPhys, envelope, drawAsset, mulberry32 } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;
  const sp = springPhys(t, 220, 18);
  const rng = mulberry32(404);
  const cx = W / 2, cy = 435;
  const title = (cfg.title || 'БАҒЫТ ПЕН МАҚСАТ').toUpperCase();

  ctx.save();
  ctx.globalAlpha = alpha;

  // 3D elliptical orbital rings behind speaker head
  for (let i = 0; i < 2; i++) {
    ctx.save();
    ctx.translate(cx, cy + 70);
    ctx.rotate((i === 0 ? 0.18 : -0.22) + t * 0.12 * (i === 0 ? 1 : -1));
    ctx.scale(1, 0.36);
    ctx.strokeStyle = i === 0 ? cfg.accent : cfg.accent2;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.52 * alpha * sp;
    ctx.beginPath();
    ctx.arc(0, 0, 320 + i * 75, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 3D perspective sparkle particles
  for (let i = 0; i < 18; i++) {
    const baseA = rng() * Math.PI * 2;
    const rad = 190 + rng() * 240;
    const speed = 0.45 + rng() * 0.55;
    const yOff = (rng() - 0.5) * 260;
    const a = baseA + t * speed;
    const x3 = Math.cos(a) * rad * sp;
    const z3 = Math.sin(a) * rad * 0.6;
    const y3 = Math.sin(a * 1.3) * 45 + yOff;
    const persp = 680 / (680 + z3 + 220);
    const px = cx + x3 * persp;
    const py = cy + y3 * persp;
    const sz = (30 + rng() * 26) * persp;
    drawAsset(ctx, imgs.sparkle, px, py, sz, 0, (0.4 + 0.55 * persp) * alpha, t * 0.9 + i);
  }

  // 3D floating card & rotating compass with perspective foreshortening (cos(yaw))
  const yaw = Math.sin(t * 1.35) * 0.28;
  const floatY = Math.sin(t * 2.1) * 14;
  drawAsset(ctx, imgs.card, cx - 185, cy + floatY, 340 * (0.9 + 0.1 * sp), 0, 0.94, -0.07, Math.cos(yaw), 1);
  drawAsset(ctx, imgs.compass, cx + 215, cy - 45 - floatY, 220 * (0.9 + 0.1 * sp), 0, 0.96, t * 0.65);

  // Caption ribbon in upper safe zone
  ctx.fillStyle = cfg.accent;
  ctx.font = '900 38px "Unbounded", "Montserrat", sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.85)';
  ctx.shadowBlur = 14;
  ctx.fillText(title.slice(0, 26), cx, 210);
  ctx.restore();
}, {
  card: '../3d/card_3d_bakyt.png',
  compass: '../3d/compass_3d_gold.png',
  sparkle: '../frazix/frazix_sparkle_gold.png',
});
</script>
</body>
</html>
