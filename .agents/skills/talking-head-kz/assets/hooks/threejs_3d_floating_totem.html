<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>3. threejs_3d_floating_totem</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// Perspective 3D Floating Totem + Orbital Sparkles adapted cleanly to full/split/overlay geometry
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { springPhys, envelope, drawAsset, mulberry32, drawStageBackdrop, deriveText } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  drawStageBackdrop(ctx, cfg.W, cfg.H, cfg, t);
  const { title, subtitle } = deriveText(cfg);
  const sp = springPhys(t, 220, 18);
  const rng = mulberry32(404);
  const cx = cfg.W / 2, cy = cfg.cy;

  ctx.save();
  ctx.globalAlpha = alpha;

  for (let i = 0; i < 2; i++) {
    ctx.save();
    ctx.translate(cx, cy + 40);
    ctx.rotate((i === 0 ? 0.18 : -0.22) + t * 0.12 * (i === 0 ? 1 : -1));
    ctx.scale(1, 0.36);
    ctx.strokeStyle = i === 0 ? cfg.accent : cfg.accent2;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.55 * alpha * sp;
    ctx.beginPath();
    ctx.arc(0, 0, (cfg.isFull ? 380 : 320) + i * 75, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  for (let i = 0; i < 18; i++) {
    const baseA = rng() * Math.PI * 2;
    const rad = 190 + rng() * 240;
    const speed = 0.45 + rng() * 0.55;
    const yOff = (rng() - 0.5) * 260;
    const a = baseA + t * speed;
    const x3 = Math.cos(a) * rad * sp;
    const z3 = Math.sin(a) * rad * 0.6;
    const y3 = Math.sin(a * 1.3) * 45 + yOff;
    const persp = 680 / (680 + z3 + 220);
    drawAsset(ctx, imgs.sparkle, cx + x3 * persp, cy + y3 * persp, (30 + rng() * 26) * persp, 0, (0.4 + 0.55 * persp) * alpha, t * 0.9 + i);
  }

  const yaw = Math.sin(t * 1.35) * 0.28;
  const floatY = Math.sin(t * 2.1) * 14;
  drawAsset(ctx, imgs.card, cx - 185, cy + floatY, 340 * (0.9 + 0.1 * sp), 0, 0.95, -0.07, Math.cos(yaw), 1);
  drawAsset(ctx, imgs.compass, cx + 215, cy - 45 - floatY, 220 * (0.9 + 0.1 * sp), 0, 0.96, t * 0.65);

  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.85)';
  ctx.shadowBlur = 14;
  if (title) {
    ctx.fillStyle = cfg.accent;
    ctx.font = '900 44px "Unbounded", "Montserrat", sans-serif';
    ctx.fillText(title.toUpperCase().slice(0, 24), cx, cy - 220);
  }
  if (subtitle) {
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'italic 700 32px "Playfair Display", serif';
    ctx.fillText(subtitle.slice(0, 32), cx, cy + 250);
  }
  ctx.restore();
}, {
  card: '../3d/card_3d_bakyt.png',
  compass: '../3d/compass_3d_gold.png',
  sparkle: '../frazix/frazix_sparkle_gold.png',
});
</script>
</body>
</html>
