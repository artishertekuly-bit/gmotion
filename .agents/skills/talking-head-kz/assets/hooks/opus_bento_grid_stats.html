<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>8. opus_bento_grid_stats</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// Parametrized Bento Grid Stats driven strictly by window.EDL_PAYLOAD (kpis[], from, to, suffix, title, subtitle)
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { W, H, cy, isFull, isSplit, clamp, seg, springPhys, envelope, roundRectPath, drawAsset, drawStageBackdrop, deriveText } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  drawStageBackdrop(ctx, cfg.W, cfg.H, cfg, t);
  const { title, subtitle, label, tokens } = deriveText(cfg);
  const hasRange = Number(cfg.to || 0) !== Number(cfg.from || 0);
  const vFrom = Number(cfg.from || 0);
  const vTo = Number(cfg.to || 0);
  const suf = String(cfg.suffix || '');
  const kpis = Array.isArray(cfg.kpis) ? cfg.kpis : [];

  const countU = clamp(seg(t, 0.14, Math.min(cfg.dur - 0.45, 1.35)));
  const easedCount = 1 - Math.pow(1 - countU, 3);
  const curVal = Math.round(vFrom + (vTo - vFrom) * easedCount);

  ctx.save();
  ctx.globalAlpha = alpha;
  drawAsset(ctx, imgs.dotgrid, cfg.W / 2, cfg.cy, 960, 0, 0.25 * alpha);

  const topY = isSplit ? 140 : (isFull ? 460 : 120);
  const mainLabel = (label || (kpis[0] && kpis[0].label) || subtitle || tokens[0] || '').toUpperCase();
  const mainValText = hasRange ? `${curVal}${suf}` : ((kpis[0] && String(kpis[0].val || '')) || title);
  const sideLabel = (kpis[1] && String(kpis[1].label || '')).toUpperCase() || (tokens[1] || '').toUpperCase();
  const sideVal = (kpis[1] && String(kpis[1].val || '')) || (subtitle ? subtitle.split(/\s+/)[0] : '');
  const botText = (title || (kpis[2] && `${kpis[2].label || ''} ${kpis[2].val || ''}`) || cfg.spoken_words || '').toUpperCase();

  const tiles = [
    { x: 90, y: topY, w: 540, h: isFull ? 320 : 250, delay: 0.00, accent: true },
    { x: 650, y: topY, w: 340, h: isFull ? 320 : 250, delay: 0.10, accent: false },
    { x: 90, y: topY + (isFull ? 350 : 275), w: 900, h: isFull ? 210 : 145, delay: 0.18, accent: false },
  ];

  // Dynamic bar visualization if series[] provided in EDL_PAYLOAD
  const series = Array.isArray(cfg.series) ? cfg.series : [];

  tiles.forEach((b, idx) => {
    const sp = springPhys(Math.max(0, t - b.delay), 220, 18);
    const sc = 0.90 + 0.10 * clamp(sp, 0, 1.06);
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    ctx.scale(sc, sc);
    roundRectPath(ctx, -b.w / 2, -b.h / 2, b.w, b.h, 24);
    ctx.fillStyle = b.accent ? 'rgba(14,12,16,0.95)' : 'rgba(22,19,26,0.92)';
    ctx.fill();
    ctx.strokeStyle = b.accent ? cfg.accent : 'rgba(255,255,255,0.22)';
    ctx.lineWidth = b.accent ? 3 : 2;
    ctx.stroke();

    if (idx === 0) {
      if (mainLabel) {
        ctx.fillStyle = 'rgba(255,255,255,0.72)';
        ctx.font = '800 22px "Montserrat", sans-serif';
        ctx.fillText(mainLabel.slice(0, 24), -b.w / 2 + 28, -b.h / 2 + 54);
      }
      ctx.fillStyle = cfg.accent;
      ctx.font = `900 ${mainValText.length > 9 ? 54 : 74}px "JetBrains Mono", monospace`;
      ctx.fillText(mainValText.slice(0, 15), -b.w / 2 + 28, 28);
    } else if (idx === 1) {
      if (sideLabel) {
        ctx.fillStyle = 'rgba(255,255,255,0.68)';
        ctx.textAlign = 'center';
        ctx.font = '800 22px "Montserrat", sans-serif';
        ctx.fillText(sideLabel.slice(0, 16), 0, -b.h / 2 + 54);
      }
      ctx.fillStyle = cfg.accent2;
      ctx.textAlign = 'center';
      ctx.font = `900 ${sideVal.length > 6 ? 44 : 62}px "JetBrains Mono", monospace`;
      ctx.fillText(sideVal.slice(0, 10), 0, 22);
    } else {
      if (series.length >= 2) {
        const bw = (b.w - 100) / series.length;
        const maxV = Math.max(...series.map(s => Math.abs(Number(s.val || s.v || 1))), 1);
        series.forEach((pt, si) => {
          const val = Number(pt.val || pt.v || 0);
          const barU = clamp(seg(t, 0.25 + si * 0.08, 1.1 + si * 0.08));
          const bh = ((b.h - 68) * Math.abs(val) / maxV) * barU;
          const bx = -b.w / 2 + 50 + si * bw + bw * 0.18;
          ctx.fillStyle = si === series.length - 1 ? cfg.accent : cfg.accent2;
          roundRectPath(ctx, bx, b.h / 2 - 36 - bh, bw * 0.64, Math.max(6, bh), 6);
          ctx.fill();
        });
      } else {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 38px "Unbounded", "Montserrat", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(botText.slice(0, 28), 0, 14);
      }
    }
    ctx.restore();
  });

  if (isFull && cfg.subtitle) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(237,230,222,0.85)';
    ctx.font = 'italic 700 44px "Playfair Display", serif';
    ctx.fillText(cfg.subtitle.slice(0, 34), cfg.W / 2, topY + 640);
  }
  ctx.restore();
}, {
  dotgrid: '../frazix/frazix_dotgrid.png',
});
</script>
</body>
</html>
