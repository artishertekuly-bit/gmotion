<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>8. opus_bento_grid_stats</title>
<style>html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
// awesome-opus5-5-videos + opus-video-prompts Bento grid stats + counter + sparkline
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { W, clamp, seg, springPhys, envelope, roundRectPath, drawAsset } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  drawAsset(ctx, imgs.dotgrid, W / 2, 370, 940, 0, 0.24 * alpha);
  const vFrom = Number(cfg.from || 0), vTo = Number(cfg.to || 160), suf = cfg.suffix || ' МЛН ₸';
  const countU = clamp(seg(t, 0.15, Math.min(cfg.dur - 0.5, 1.35)));
  const easedCount = 1 - Math.pow(1 - countU, 3);
  const curVal = Math.round(vFrom + (vTo - vFrom) * easedCount);

  ctx.save();
  ctx.globalAlpha = alpha;

  const tiles = [
    { x: 110, y: 185, w: 500, h: 250, delay: 0.00, accent: true },
    { x: 630, y: 185, w: 340, h: 250, delay: 0.10, accent: false },
    { x: 110, y: 455, w: 860, h: 120, delay: 0.18, accent: false },
  ];

  tiles.forEach((b, idx) => {
    const sp = springPhys(Math.max(0, t - b.delay), 220, 18);
    const sc = 0.91 + 0.09 * clamp(sp, 0, 1.06);
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    ctx.scale(sc, sc);
    roundRectPath(ctx, -b.w / 2, -b.h / 2, b.w, b.h, 24);
    ctx.fillStyle = b.accent ? 'rgba(14,12,14,0.94)' : 'rgba(22,18,22,0.90)';
    ctx.fill();
    ctx.strokeStyle = b.accent ? cfg.accent : 'rgba(255,255,255,0.22)';
    ctx.lineWidth = b.accent ? 3 : 2;
    ctx.stroke();

    if (idx === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.68)';
      ctx.font = '800 22px "Montserrat", sans-serif';
      ctx.fillText((cfg.label || 'НЕГІЗГІ КӨРСЕТКІШ').toUpperCase().slice(0, 22), -b.w / 2 + 28, -58);
      ctx.fillStyle = cfg.accent;
      ctx.font = '900 72px "JetBrains Mono", monospace';
      ctx.fillText(`${curVal}${suf}`, -b.w / 2 + 28, 36);
    } else if (idx === 1) {
      // Progress donut
      const p = clamp(seg(t, 0.25, 1.4));
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 14;
      ctx.beginPath(); ctx.arc(0, 0, 62, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = cfg.accent2;
      ctx.beginPath(); ctx.arc(0, 0, 62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p * 0.88); ctx.stroke();
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.font = '900 32px "JetBrains Mono", monospace';
      ctx.fillText(`${Math.round(p * 88)}%`, 0, 10);
    } else {
      ctx.fillStyle = cfg.accent2;
      ctx.font = '900 34px "Unbounded", "Montserrat", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText((cfg.title || 'РЕКОРДТЫҚ ДИНАМИКА').toUpperCase().slice(0, 26), 0, 12);
    }
    ctx.restore();
  });

  ctx.restore();
}, {
  dotgrid: '../frazix/frazix_dotgrid.png',
});
</script>
</body>
</html>
