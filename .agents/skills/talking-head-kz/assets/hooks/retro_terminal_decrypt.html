<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>12. retro_terminal_decrypt</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// Retro CRT terminal decryption strictly powered by EDL_PAYLOAD title/subtitle/code_lines
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { clamp, seg, mulberry32, envelope, roundRectPath, drawAsset, drawStageBackdrop, deriveText } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  drawStageBackdrop(ctx, cfg.W, cfg.H, cfg, t);
  const { title, subtitle, label } = deriveText(cfg);
  const target = title.toUpperCase();
  const glyphs = '01#@$%&*ҚҒҢӨҰҮҺІӘ';
  const decU = clamp(seg(t, 0.14, Math.min(cfg.dur - 0.50, 1.55)));
  const rng = mulberry32(Math.floor(t * 24) + 55);

  let shown = '';
  for (let i = 0; i < target.length; i++) {
    shown += (target[i] === ' ' || i / Math.max(target.length, 1) <= decU)
      ? target[i]
      : glyphs[Math.floor(rng() * glyphs.length)];
  }

  const boxY = cfg.cy - 140;
  ctx.save();
  ctx.globalAlpha = alpha;
  roundRectPath(ctx, 100, boxY, 880, 280, 18);
  ctx.fillStyle = 'rgba(8, 12, 10, 0.94)';
  ctx.fill();
  ctx.strokeStyle = cfg.accent2;
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = 'rgba(0, 230, 118, 0.06)';
  for (let sy = boxY + 8; sy < boxY + 272; sy += 6) {
    ctx.fillRect(104, sy, 872, 2);
  }

  if (label || subtitle) {
    ctx.font = '700 22px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(237,230,222,0.82)';
    ctx.fillText((subtitle || label).toUpperCase().slice(0, 38), 140, boxY + 58);
  }

  ctx.font = '800 44px "JetBrains Mono", Consolas, monospace';
  ctx.fillStyle = 'rgba(237, 59, 34, 0.55)';
  ctx.fillText('> ' + shown.slice(0, 22), 142, boxY + 148);
  ctx.fillStyle = decU >= 0.99 ? cfg.accent : cfg.accent2;
  ctx.fillText('> ' + shown.slice(0, 22), 138, boxY + 148);

  if (Array.isArray(cfg.code_lines)) {
    ctx.font = '700 22px "JetBrains Mono", monospace';
    ctx.fillStyle = 'rgba(0,230,118,0.85)';
    cfg.code_lines.slice(0, 2).forEach((ln, idx) => {
      ctx.fillText(String(ln).slice(0, 34), 140, boxY + 198 + idx * 32);
    });
  }

  drawAsset(ctx, imgs.barcode, 850, boxY + 225, 165, 0, 0.9);
  ctx.restore();
}, {
  barcode: '../frazix/frazix_barcode.png',
});
</script>
</body>
</html>
