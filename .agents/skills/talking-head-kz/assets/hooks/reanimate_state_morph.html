<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>6. reanimate_state_morph</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// Reanimate State A -> State B continuous vertex & perceptual color morph from EDL_PAYLOAD
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { lerp, clamp, seg, springPhys, mixColor, envelope, roundRectPath, drawStageBackdrop, deriveText } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  drawStageBackdrop(ctx, cfg.W, cfg.H, cfg, t);
  const { title, subtitle, label, tokens } = deriveText(cfg);
  const uRaw = clamp(seg(t, 0.72, Math.min(cfg.dur - 0.50, 2.2)));
  const u = springPhys(uRaw * 0.75, 220, 18);
  const morphCol = mixColor(cfg.danger, cfg.accent2, u);
  const cx = cfg.W / 2, cy = cfg.cy;

  const leftText = String(cfg.left_label || cfg.left_title || label || tokens[0] || '').toUpperCase();
  const rightText = String(cfg.right_label || cfg.right_title || subtitle || tokens[tokens.length - 1] || '').toUpperCase();

  ctx.save();
  ctx.globalAlpha = alpha;
  roundRectPath(ctx, 110, cy - 165, 860, 330, 28);
  ctx.fillStyle = 'rgba(11,11,14,0.92)';
  ctx.fill();
  ctx.strokeStyle = morphCol;
  ctx.lineWidth = 4;
  ctx.stroke();

  const stateA = [[200, cy - 15], [360, cy + 48], [520, cy + 20], [680, cy + 95], [860, cy + 115]];
  const stateB = [[200, cy + 95], [360, cy + 52], [520, cy + 8], [680, cy - 35], [860, cy - 62]];
  ctx.beginPath();
  for (let i = 0; i < stateA.length; i++) {
    const px = lerp(stateA[i][0], stateB[i][0], u);
    const py = lerp(stateA[i][1], stateB[i][1], u);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = morphCol;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.font = '900 30px "Montserrat", sans-serif';
  if (leftText) {
    ctx.textAlign = 'left';
    ctx.fillStyle = u < 0.5 ? cfg.danger : 'rgba(255,255,255,0.45)';
    ctx.fillText(leftText.slice(0, 18), 155, cy - 110);
  }
  if (rightText) {
    ctx.textAlign = 'right';
    ctx.fillStyle = u >= 0.5 ? cfg.accent2 : 'rgba(255,255,255,0.45)';
    ctx.fillText(rightText.slice(0, 18), 925, cy - 110);
  }
  if (title) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 44px "Unbounded", "Montserrat", sans-serif';
    ctx.fillText(title.toUpperCase().slice(0, 24), cx, cy + 220);
  }
  ctx.restore();
}, {});
</script>
</body>
</html>
