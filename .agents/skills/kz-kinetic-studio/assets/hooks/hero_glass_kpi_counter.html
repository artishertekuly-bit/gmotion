<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=880, height=420, initial-scale=1.0" />
<title>Hero: Frosted Glass KPI Counter</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { clamp, seg, springPhys, envelope, roundRectPath, drawGlassPanel, drawAsset, formatSpaced, deriveText } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  const { title, subtitle, label } = deriveText(cfg);
  const sp = springPhys(t, 230, 18);
  const cx = cfg.W * 0.5, cy = cfg.H * 0.5;
  const cw = 760, ch = 270;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy + (1 - sp) * 34);
  const sc = 0.90 + 0.10 * sp;
  ctx.scale(sc, sc);

  // Frosted Glassmorphism Container (Apple/Rossark translucent card)
  drawGlassPanel(ctx, -cw / 2, -ch / 2, cw, ch, 30, {
    topFill: 'rgba(255, 255, 255, 0.16)',
    botFill: 'rgba(18, 22, 32, 0.62)',
    borderColor: 'rgba(255, 255, 255, 0.36)',
    borderWidth: 1.8,
  });

  // Top-left live pill indicator
  const tagText = (label || title).toUpperCase().slice(0, 26);
  if (tagText) {
    ctx.save();
    roundRectPath(ctx, -cw / 2 + 34, -ch / 2 + 26, Math.min(340, 56 + tagText.length * 14), 38, 19);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fill();
    ctx.fillStyle = cfg.accent;
    ctx.beginPath();
    ctx.arc(-cw / 2 + 58, -ch / 2 + 45, 5 + Math.sin(t * 7) * 1.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#F7F4EC';
    ctx.font = '800 18px "JetBrains Mono", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(tagText, -cw / 2 + 74, -ch / 2 + 51);
    ctx.restore();
  }

  // Rolling Slot-Counter value
  const fromN = Number(cfg.from || 0);
  const toN = Number(cfg.to || 0);
  const u = clamp(seg(t, 0.12, Math.min(cfg.dur - 0.55, 1.35)));
  const ease = 1 - Math.pow(1 - u, 3);
  const val = fromN + (toN - fromN) * ease;
  const suf = String(cfg.suffix || '').trim();
  let displayNum = '';
  if (toN > 0) {
    displayNum = (Number.isInteger(toN) ? formatSpaced(val) : val.toFixed(1)) + (suf ? ' ' + suf : '');
  } else {
    displayNum = title.toUpperCase().slice(0, 18);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = cfg.accent;
  ctx.shadowColor = 'rgba(255, 214, 0, 0.32)';
  ctx.shadowBlur = 18;
  ctx.font = '900 72px "Unbounded", "Montserrat", sans-serif';
  ctx.fillText(displayNum.trim(), 0, 28);
  ctx.shadowBlur = 0;

  if (subtitle) {
    ctx.fillStyle = 'rgba(247, 244, 236, 0.88)';
    ctx.font = 'italic 700 28px "Playfair Display", Georgia, serif';
    ctx.fillText(subtitle.slice(0, 38), 0, ch / 2 - 36);
  }

  // Animated glass light sweep
  const glintU = (t * 0.72) % 1.8;
  if (glintU <= 1.0) {
    ctx.save();
    roundRectPath(ctx, -cw / 2, -ch / 2, cw, ch, 30);
    ctx.clip();
    const gx = -cw / 2 - 140 + glintU * (cw + 280);
    const gg = ctx.createLinearGradient(gx - 70, 0, gx + 70, 0);
    gg.addColorStop(0, 'rgba(255,255,255,0)');
    gg.addColorStop(0.5, 'rgba(255,255,255,0.14)');
    gg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(gx - 70, -ch / 2, 140, ch);
    ctx.restore();
  }

  // Frazix gold sparkle flare on top-right
  const spk = 0.7 + 0.3 * Math.sin(t * 5.2);
  drawAsset(ctx, imgs.sparkleGold, cw / 2 - 42, -ch / 2 + 44, 72 * spk, 0, 0.9 * sp, t * 0.65);

  ctx.restore();
}, {
  sparkleGold: '../frazix/frazix_sparkle_gold.png',
}, { W: 880, H: 420 });
</script>
</body>
</html>
