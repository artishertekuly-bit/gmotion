<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=880, height=460, initial-scale=1.0" />
<title>Hero: 3D Floating Totem Badge</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;}canvas{display:block;}</style>
<script src="_hook_core.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
HookCore.initStage((ctx, t, imgs, cfg) => {
  const { springPhys, envelope, drawAsset, drawGlassPanel, deriveText } = HookCore;
  const { alpha } = envelope(t, cfg.dur);
  if (alpha <= 0.005) return;

  const { title, subtitle } = deriveText(cfg);
  const sp = springPhys(t, 220, 17);
  const bob = Math.sin(t * 2.5) * 12;
  const tilt = Math.sin(t * 1.7) * 0.055;
  const useCard = String(cfg.asset || '').toLowerCase().includes('card');
  const totem = (useCard ? imgs.card : imgs.compass);

  const cx = cfg.W * 0.5, cy = cfg.H * 0.44 + bob;

  ctx.save();
  ctx.globalAlpha = alpha;

  // Soft warm volumetric aura behind floating 3D object (transparent edge)
  const rg = ctx.createRadialGradient(cx, cy, 18, cx, cy, 220);
  rg.addColorStop(0, 'rgba(255, 214, 0, 0.28)');
  rg.addColorStop(0.55, 'rgba(255, 168, 0, 0.08)');
  rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(cx, cy, 220, 0, Math.PI * 2); ctx.fill();

  // Floating 3D Asset with subtle shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 28;
  ctx.shadowOffsetY = 18;
  drawAsset(ctx, totem, cx, cy + (1 - sp) * 42, 235 * (0.85 + 0.15 * sp), 0, alpha, tilt);
  ctx.restore();

  drawAsset(ctx, imgs.sparkleGold, cx + 118, cy - 82, 58, 0, 0.88 * alpha, t * 0.9);
  drawAsset(ctx, imgs.arrowDown, cx - 155, cy + 56, 76, 0, 0.90 * alpha, -0.18);

  // Floating frosted pill badge below 3D totem
  const badgeTxt = title.toUpperCase().slice(0, 22);
  if (badgeTxt) {
    const bw = Math.min(720, Math.max(360, badgeTxt.length * 26 + 90));
    const bh = subtitle ? 92 : 66;
    const bx = cx - bw / 2, by = cfg.H - bh - 24;
    drawGlassPanel(ctx, bx, by, bw, bh, 22, {
      topFill: 'rgba(22, 24, 30, 0.80)',
      botFill: 'rgba(14, 15, 20, 0.88)',
      borderColor: 'rgba(255, 214, 0, 0.42)',
      borderWidth: 1.5,
    });
    ctx.textAlign = 'center';
    ctx.fillStyle = cfg.accent;
    ctx.font = '900 30px "Unbounded", "Montserrat", sans-serif';
    ctx.fillText(badgeTxt, cx, by + (subtitle ? 40 : 44));
    if (subtitle) {
      ctx.fillStyle = '#EFECE6';
      ctx.font = 'italic 700 22px "Playfair Display", Georgia, serif';
      ctx.fillText(subtitle.slice(0, 34), cx, by + 72);
    }
  }
  ctx.restore();
}, {
  compass: '../3d/compass_3d_gold.png',
  card: '../3d/card_3d_bakyt.png',
  sparkleGold: '../frazix/frazix_sparkle_gold.png',
  arrowDown: '../graffiti/arrow_yellow_down.png',
}, { W: 880, H: 460 });
</script>
</body>
</html>
